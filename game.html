  <script>
// 数学工具

function dist(x1, y1, x2, y2) {
  const dx = x2 - x1;
  const dy = y2 - y1;
  return Math.sqrt(dx * dx + dy * dy);
}

function angleTo(x1, y1, x2, y2) {
  return Math.atan2(y2 - y1, x2 - x1);
}

function lerp(a, b, t) {
  return a + (b - a) * t;
}

function clamp(v, min, max) {
  return v < min ? min : v > max ? max : v;
}

function rand(min, max) {
  return min + Math.random() * (max - min);
}

function randInt(min, max) {
  return Math.floor(rand(min, max + 1));
}

// 归一化角度到 [-PI, PI]
function normAngle(a) {
  while (a > Math.PI) a -= Math.PI * 2;
  while (a < -Math.PI) a += Math.PI * 2;
  return a;
}

// 角度线性插值（走最短弧）
function lerpAngle(a, b, t) {
  let diff = normAngle(b - a);
  return a + diff * t;
}

// 粘性辅助瞄准
// 返回：修正后的瞄准角度
function aimAssist(originX, originY, aimAngle, enemies, radius, strength) {
  let best = null;
  let bestDist = radius;

  for (const e of enemies) {
    if (!e.active) continue;
    const d = dist(originX, originY, e.x, e.y);
    if (d >= radius) continue;
    const toEnemy = angleTo(originX, originY, e.x, e.y);
    const diff = Math.abs(normAngle(aimAngle - toEnemy));
    // 只在敌人处于瞄准方向 ±45° 内吸附
    if (diff < Math.PI / 4 && d < bestDist) {
      bestDist = d;
      best = toEnemy;
    }
  }

  if (best !== null) {
    return lerpAngle(aimAngle, best, strength);
  }
  return aimAngle;
}

  <script>
// 虚拟双摇杆 — 底层输入抽象
// side = 'left' | 'right'，自动识别触点在左半屏还是右半屏

class VirtualJoystick {
  constructor(side, maxRadius = 80) {
    this.side = side;
    this.maxRadius = maxRadius;
    this.deadZone = 0.15;
    this.touchId = null;
    this.active = false;
    this.baseX = 0;
    this.baseY = 0;
    this.knobX = 0;
    this.knobY = 0;
    this.normX = 0;
    this.normY = 0;
    this.magnitude = 0;
    this.angle = 0;
    this.alpha = 0;
  }

  // 尝试接管触摸，zone 判断在调用方做
  tryStart(touchId, x, y, screenW) {
    const inZone = this.side === 'left'
      ? x < screenW / 2
      : x >= screenW / 2;
    if (!inZone || this.touchId !== null) return false;

    this.touchId = touchId;
    this.baseX = x;
    this.baseY = y;
    this.knobX = x;
    this.knobY = y;
    this.active = true;
    return true;
  }

  handleMove(touchId, x, y) {
    if (touchId !== this.touchId) return;
    this.knobX = x;
    this.knobY = y;

    const dx = x - this.baseX;
    const dy = y - this.baseY;
    const d = Math.sqrt(dx * dx + dy * dy);

    if (d > this.maxRadius) {
      // 拉到极限
      const r = this.maxRadius / d;
      this.normX = dx * r / this.maxRadius;
      this.normY = dy * r / this.maxRadius;
      this.magnitude = 1;
    } else if (d / this.maxRadius < this.deadZone) {
      // 死区内
      this.normX = 0;
      this.normY = 0;
      this.magnitude = 0;
    } else {
      // 死区到极限之间，线性映射
      const raw = (d / this.maxRadius - this.deadZone) / (1 - this.deadZone);
      this.normX = (dx / d) * raw;
      this.normY = (dy / d) * raw;
      this.magnitude = raw;
    }

    this.angle = Math.atan2(dy, dx);
  }

  handleEnd(touchId) {
    if (touchId !== this.touchId) return;
    this.touchId = null;
    this.active = false;
    this.normX = 0;
    this.normY = 0;
    this.magnitude = 0;
  }

  update(dt) {
    const target = this.active ? 1 : 0;
    this.alpha = lerp(this.alpha, target, dt * 12);
  }

  render(ctx) {
    if (this.alpha < 0.02) return;
    ctx.save();

    // 底圈
    ctx.globalAlpha = this.alpha * 0.35;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(this.baseX, this.baseY, this.maxRadius, 0, Math.PI * 2);
    ctx.stroke();

    // 摇杆头
    ctx.globalAlpha = this.alpha * 0.6;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(this.knobX, this.knobY, this.maxRadius * 0.38, 0, Math.PI * 2);
    ctx.fill();

    ctx.restore();
  }
}

// 音效 — Web Audio API 合成 + 哈气录音

class AudioManager {
  constructor() {
    this.ctx = null;
    this.ready = false;
    this._hissAudios = null;
  }

  // 必须在用户手势回调里调用以解锁 AudioContext
  init() {
    if (this.ready) return;
    try {
      this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      this.ready = true;
    } catch (_) {}
  }

  _tone(freq, dur, type = 'square', vol = 0.06) {
    if (!this.ready) return;
    try {
      const t = this.ctx.currentTime;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, t);
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      osc.connect(gain);
      gain.connect(this.ctx.destination);
      osc.start(t);
      osc.stop(t + dur);
    } catch (_) {}
  }

  _noise(dur, vol = 0.05) {
    if (!this.ready) return;
    try {
      const t = this.ctx.currentTime;
      const size = this.ctx.sampleRate * dur;
      const buf = this.ctx.createBuffer(1, size, this.ctx.sampleRate);
      const data = buf.getChannelData(0);
      for (let i = 0; i < size; i++) data[i] = (Math.random() * 2 - 1);
      const src = this.ctx.createBufferSource();
      src.buffer = buf;
      const gain = this.ctx.createGain();
      gain.gain.setValueAtTime(vol, t);
      gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
      src.connect(gain);
      gain.connect(this.ctx.destination);
      src.start(t);
    } catch (_) {}
  }

  shoot()      { this._noise(0.04, 0.04); this._tone(900, 0.03, 'square', 0.03); }
  hit()        { this._tone(220, 0.07, 'sawtooth', 0.06); }
  explosion()  { this._noise(0.18, 0.07); this._tone(70, 0.15, 'triangle', 0.08); }
  playerHit()  { this._tone(120, 0.25, 'square', 0.1); this._tone(80, 0.3, 'triangle', 0.08); }
  waveClear()  {
    this._tone(523, 0.12, 'square', 0.06);
    setTimeout(() => this._tone(659, 0.12, 'square', 0.06), 120);
    setTimeout(() => this._tone(784, 0.18, 'square', 0.06), 240);
  }

// 粒子对象池 — 命中火花 / 爆炸 / 死亡粒子

class ParticlePool {
  constructor(size = 500) {
    this.pool = [];
    for (let i = 0; i < size; i++) {
      this.pool.push({
        x: 0, y: 0,
        vx: 0, vy: 0,
        life: 0, maxLife: 0,
        size: 2,
        color: '#fff',
        active: false
      });
    }
  }

  // config: { count, minSpeed, maxSpeed, minLife, maxLife, minSize, maxSize, colors }
  emit(x, y, config) {
    const {
      count = 10,
      minSpeed = 50, maxSpeed = 200,
      minLife = 0.2, maxLife = 0.6,
      minSize = 1, maxSize = 4,
      colors = ['#ff0', '#f80']
    } = config;

    let spawned = 0;
    for (const p of this.pool) {
      if (p.active) continue;
      const angle = Math.random() * Math.PI * 2;
      const speed = rand(minSpeed, maxSpeed);
      p.x = x;
      p.y = y;
      p.vx = Math.cos(angle) * speed;
      p.vy = Math.sin(angle) * speed;
      p.maxLife = rand(minLife, maxLife);
      p.life = p.maxLife;
      p.size = rand(minSize, maxSize);
      p.color = colors[randInt(0, colors.length - 1)];
      p.active = true;
      spawned++;
      if (spawned >= count) break;
    }
  }

  update(dt) {
    for (const p of this.pool) {
      if (!p.active) continue;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vx *= 0.95; // 轻微阻力
      p.vy *= 0.95;
      p.life -= dt;
      if (p.life <= 0) p.active = false;
    }
  }

  render(ctx, camX, camY, sw, sh) {
    for (const p of this.pool) {
      if (!p.active) continue;
      const sx = p.x - camX + sw / 2;
      const sy = p.y - camY + sh / 2;
      if (sx < -20 || sx > sw + 20 || sy < -20 || sy > sh + 20) continue;
      const t = p.life / p.maxLife;
      ctx.save();
      ctx.globalAlpha = t;
      ctx.fillStyle = p.color;
      ctx.fillRect(sx - p.size / 2, sy - p.size / 2, p.size, p.size);
      ctx.restore();
    }
  }
}

// 子弹对象池

class BulletPool {
  constructor(size = 200) {
    this.pool = [];
    for (let i = 0; i < size; i++) {
      this.pool.push({
        x: 0, y: 0,
        vx: 0, vy: 0,
        speed: 0,
        damage: 0,
        life: 0,
        active: false
      });
    }
  }

  fire(x, y, angle, speed, damage) {
    for (const b of this.pool) {
      if (b.active) continue;
      b.x = x;
      b.y = y;
      b.vx = Math.cos(angle) * speed;
      b.vy = Math.sin(angle) * speed;
      b.speed = speed;
      b.damage = damage;
      b.life = 1.5; // 最多存活 1.5 秒
      b.active = true;
      return;
    }
  }

  update(dt, worldSize) {
    for (const b of this.pool) {
      if (!b.active) continue;
      b.x += b.vx * dt;
      b.y += b.vy * dt;
      b.life -= dt;
      // 出界或超时回收
      if (b.x < -50 || b.x > worldSize + 50 ||
          b.y < -50 || b.y > worldSize + 50 ||
          b.life <= 0) {
        b.active = false;
      }
    }
  }

  getActive() {
    return this.pool.filter(b => b.active);
  }

  render(ctx, camX, camY, sw, sh) {
    ctx.fillStyle = '#FFEB3B';
    ctx.shadowColor = '#FFEB3B';
    ctx.shadowBlur = 4;
    for (const b of this.pool) {
      if (!b.active) continue;
      const sx = b.x - camX + sw / 2;
      const sy = b.y - camY + sh / 2;
      if (sx < -10 || sx > sw + 10 || sy < -10 || sy > sh + 10) continue;
      ctx.fillRect(sx - 2, sy - 2, 4, 4);
    }
    ctx.shadowBlur = 0;
  }
}

class Player {
  constructor(x, y) {
    this.x = x;
    this.y = y;
    this.radius = PLAYER_RADIUS;
    this.speed = PLAYER_SPEED;
    this.angle = 0;
    this.hp = PLAYER_MAX_HP;
    this.maxHp = PLAYER_MAX_HP;
    this.alive = true;
    this.fireTimer = 0;
    this.invulnTimer = 0;
    this.hitFlash = 0;

    // 状态图计时器（优先级：kill > hurt > stuck > default）
    this.killFlashTimer = 0;   // 击败小怪 0.5s
    this.hurtFlashTimer = 0;   // 受到攻击 0.88s
    this.stuckFlashTimer = 0;  // 攻击同目标超2s未击杀 0.88s
  }

  update(dt, moveJoy, shootJoy, worldSize) {
    if (!this.alive) return;

    // 移动
    if (moveJoy.active && moveJoy.magnitude > 0) {
      this.x += moveJoy.normX * this.speed * moveJoy.magnitude * dt;
      this.y += moveJoy.normY * this.speed * moveJoy.magnitude * dt;
    }
    this.x = clamp(this.x, this.radius, worldSize - this.radius);
    this.y = clamp(this.y, this.radius, worldSize - this.radius);

    // 瞄准方向
    if (shootJoy.active && shootJoy.magnitude > 0.1) {
      this.angle = shootJoy.angle;
    }

    this.fireTimer -= dt;
    this.invulnTimer -= dt;
    this.hitFlash -= dt;
    this.killFlashTimer -= dt;
    this.hurtFlashTimer -= dt;
    this.stuckFlashTimer -= dt;
  }

  fire(dt, bulletPool) {
    if (this.fireTimer > 0) return;
    this.fireTimer = FIRE_INTERVAL;
    const bx = this.x + Math.cos(this.angle) * (this.radius + 4);
    const by = this.y + Math.sin(this.angle) * (this.radius + 4);
    bulletPool.fire(bx, by, this.angle, BULLET_SPEED, BULLET_DAMAGE);
  }

  takeDamage(dmg, gameTime) {
    if (this.invulnTimer > 0 || !this.alive) return false;
    this.hp -= dmg;
    this.invulnTimer = INVULN_TIME;
    this.hitFlash = 0.15;
    this.hurtFlashTimer = 0.88;
    if (this.hp <= 0) {
      this.hp = 0;
      this.alive = false;
    }
    return true;
  }

  // 由 main.js 调用，击杀敌人时触发
  onKill() {
    this.killFlashTimer = 0.5;
  }

  // 由 main.js 调用，攻击同目标超2s
  onAttackStuck() {
    this.stuckFlashTimer = 0.88;
  }

  isInvulnerable() { return this.invulnTimer > 0; }

  // 当前应该显示的状态图（按优先级）
  _currentImg() {
    if (this.killFlashTimer > 0 && imgKill) return imgKill;
    if (this.hurtFlashTimer > 0 && imgHurt) return imgHurt;
    if (this.stuckFlashTimer > 0 && imgStuck) return imgStuck;
    return imgDefault;
  }

  render(ctx, camX, camY, sw, sh) {
    if (!this.alive) return;
    const sx = this.x - camX + sw / 2;
    const sy = this.y - camY + sh / 2;
    const r = this.radius;

    ctx.save();
    ctx.translate(sx, sy);

    // 圆形裁剪
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.clip();

    const curImg = this._currentImg();

    if (curImg) {
      // 受伤闪烁
      if (this.hitFlash > 0 && Math.sin(this.hitFlash * 60) > 0) {
        ctx.globalAlpha = 0.35;
      }
      // 无敌闪烁
      if (this.invulnTimer > 0 && Math.floor(this.invulnTimer * 10) % 2 === 0 && this.hitFlash <= 0) {
        ctx.globalAlpha = 0.4;
      }

      // 发光效果
      ctx.shadowColor = '#4FC3F7';
      ctx.shadowBlur = 12;
      // 如果是特殊状态，切换发光颜色
      if (this.killFlashTimer > 0) {
        ctx.shadowColor = '#FFEB3B';
        ctx.shadowBlur = 18;
      } else if (this.hurtFlashTimer > 0) {
        ctx.shadowColor = '#F44336';
        ctx.shadowBlur = 14;
      } else if (this.stuckFlashTimer > 0) {
        ctx.shadowColor = '#FF9800';
        ctx.shadowBlur = 14;
      }

      ctx.drawImage(curImg, -r, -r, r * 2, r * 2);
      ctx.shadowBlur = 0;
    } else {
      // 降级：蓝色圆形
      ctx.globalAlpha = this.invulnTimer > 0 && Math.floor(this.invulnTimer * 10) % 2 === 0 ? 0.4 : 1;
      ctx.fillStyle = '#4FC3F7';
      ctx.shadowColor = '#4FC3F7';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.fill();
      ctx.shadowBlur = 0;

      // 方向箭头
      ctx.fillStyle = '#fff';
      ctx.save();
      ctx.rotate(this.angle);
      ctx.beginPath();
      ctx.moveTo(r + 6, 0);
      ctx.lineTo(r - 2, -5);
      ctx.lineTo(r - 2, 5);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    ctx.restore();
  }
}

class EnemyManager {
  constructor(max = 60) {
    this.pool = [];
    for (let i = 0; i < max; i++) {
      this.pool.push({
        x: 0, y: 0,
        vx: 0, vy: 0,
        angle: 0,
        rot: 0,
        hp: 0, maxHp: 0,
        speed: 0,
        damage: 0,
        radius: 0,
        color: '#fff',
        type: 'basic',
        score: 0,
        active: false,
        hitFlash: 0,
        img: null
      });
    }
  }

  get idleCount() {
    return this.pool.filter(e => !e.active).length;
  }

  get aliveCount() {
    return this.pool.filter(e => e.active).length;
  }

  getActive() {
    return this.pool.filter(e => e.active);
  }

  // 随机选一张小怪图片
  _randomImg() {
    const loaded = enemyImgs.filter(im => im != null);
    if (loaded.length === 0) return null;
    return loaded[randInt(0, loaded.length - 1)];
  }

  // 在视野外生成一个敌人
  _spawnOne(type, camX, camY, sw, sh) {
    for (const e of this.pool) {
      if (e.active) continue;
      const cfg = ENEMY_TYPES[type];
      const side = randInt(0, 3);
      const margin = 80;
      let sx, sy;
      const vl = camX - sw / 2 - margin;
      const vr = camX + sw / 2 + margin;
      const vt = camY - sh / 2 - margin;
      const vb = camY + sh / 2 + margin;
      switch (side) {
        case 0: sx = rand(vl, vr); sy = vt; break;
        case 1: sx = vr; sy = rand(vt, vb); break;
        case 2: sx = rand(vl, vr); sy = vb; break;
        case 3: sx = vl; sy = rand(vt, vb); break;
      }
      e.x = clamp(sx, cfg.radius, WORLD_SIZE - cfg.radius);
      e.y = clamp(sy, cfg.radius, WORLD_SIZE - cfg.radius);
      e.hp = cfg.hp;
      e.maxHp = cfg.hp;
      e.speed = cfg.speed;
      e.damage = cfg.damage;
      e.radius = cfg.radius;
      e.color = cfg.color;
      e.type = type;
      e.score = cfg.score;
      e.active = true;
      e.hitFlash = 0;
      e.rot = 0;
      e.img = this._randomImg();
      return;
    }
  }

  // 按波次定义生成
  spawnWave(waveNum, camX, camY, sw, sh) {
    let def;
    if (waveNum <= WAVE_DEFS.length) {
      def = WAVE_DEFS[waveNum - 1];
    } else {
      const extra = waveNum - WAVE_DEFS.length;
      def = {
        basic: 5 + extra * 2,
        fast: 2 + extra,
        tank: Math.max(0, extra - 1)
      };
    }
    for (let i = 0; i < def.basic; i++) this._spawnOne('basic', camX, camY, sw, sh);
    for (let i = 0; i < def.fast; i++) this._spawnOne('fast', camX, camY, sw, sh);
    for (let i = 0; i < (def.tank || 0); i++) this._spawnOne('tank', camX, camY, sw, sh);
  }

  update(dt, player) {
    const allActive = this.getActive();

    for (const e of allActive) {
      e.hitFlash -= dt;

      // 朝玩家移动
      const dx = player.x - e.x;
      const dy = player.y - e.y;
      const d = Math.sqrt(dx * dx + dy * dy) || 0.001;
      let vx = (dx / d) * e.speed;
      let vy = (dy / d) * e.speed;

      // 分离力（避免敌人堆叠）
      let sepX = 0, sepY = 0;
      for (const other of allActive) {
        if (other === e) continue;
        const odx = e.x - other.x;
        const ody = e.y - other.y;
        const od = Math.sqrt(odx * odx + ody * ody) || 0.001;
        const minDist = e.radius + other.radius + 8;
        if (od < minDist) {
          sepX += (odx / od) * (minDist - od) * 2;
          sepY += (ody / od) * (minDist - od) * 2;
        }
      }

      vx += sepX;
      vy += sepY;
      const mag = Math.sqrt(vx * vx + vy * vy) || 0.001;
      vx = vx / mag * e.speed;
      vy = vy / mag * e.speed;

      e.vx = vx;
      e.vy = vy;
      e.angle = Math.atan2(vy, vx);
      e.rot += dt * (e.type === 'fast' ? 3 : e.type === 'tank' ? 1 : 2);
      e.x += vx * dt;
      e.y += vy * dt;
      e.x = clamp(e.x, e.radius, WORLD_SIZE - e.radius);
      e.y = clamp(e.y, e.radius, WORLD_SIZE - e.radius);
    }
  }

  // 返回击杀的敌人分数（0 = 没死）
  damageAt(index, dmg) {
    const e = this.pool[index];
    if (!e || !e.active) return 0;
    e.hp -= dmg;
    e.hitFlash = 0.07;
    if (e.hp <= 0) {
      e.active = false;
      return e.score;
    }
    return 0;
  }

  render(ctx, camX, camY, sw, sh) {
    for (const e of this.pool) {
      if (!e.active) continue;
      const sx = e.x - camX + sw / 2;
      const sy = e.y - camY + sh / 2;
      if (sx < -e.radius * 2 || sx > sw + e.radius * 2 ||
          sy < -e.radius * 2 || sy > sh + e.radius * 2) continue;

      const r = e.radius;

      ctx.save();
      ctx.translate(sx, sy);

      // 圆形裁剪路径
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.clip();

      if (e.img) {
        // 受伤闪白
        if (e.hitFlash > 0) {
          ctx.globalAlpha = 1;
          ctx.drawImage(e.img, -r, -r, r * 2, r * 2);
          // 白色叠加
          ctx.fillStyle = 'rgba(255,255,255,0.7)';
          ctx.fillRect(-r, -r, r * 2, r * 2);
        } else {
          ctx.drawImage(e.img, -r, -r, r * 2, r * 2);
        }
      } else {
        // 没有图片时的降级绘制
        ctx.fillStyle = e.hitFlash > 0 ? '#fff' : e.color;
        ctx.beginPath();
        ctx.arc(0, 0, r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 圆形边框
      if (e.isBoss) {
        // Boss 边框：金色粗边 + 脉冲
        const pulse = 1 + Math.sin(Date.now() / 200) * 0.3;
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 4 * pulse;
        ctx.shadowColor = '#E91E63';
        ctx.shadowBlur = 18;
      } else {
        ctx.strokeStyle = e.type === 'tank' ? '#B71C1C' : e.type === 'fast' ? '#FF9800' : 'rgba(255,255,255,0.3)';
        ctx.lineWidth = e.type === 'tank' ? 3 : 1.5;
      }
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.shadowBlur = 0;

      // Boss 血条
      if (e.isBoss) {
        const barW = r * 2;
        const barH = 5;
        const barY = -r - 12;
        ctx.fillStyle = '#333';
        ctx.fillRect(-barW / 2, barY, barW, barH);
        const hpR = e.hp / e.maxHp;
        ctx.fillStyle = hpR > 0.5 ? '#4CAF50' : hpR > 0.25 ? '#FF9800' : '#F44336';
        ctx.fillRect(-barW / 2, barY, barW * hpR, barH);
      }

      ctx.restore();
    }
  }
}

// Boss 系统 — 每3波出 boss，技能：哈气（白色wifi声波），逐级加强

const BOSS_RADIUS = 40;
const BOSS_BASE_HP = 600;
const BOSS_HP_PER_LEVEL = 200;  // 每级 +150 HP
const BOSS_SPEED_BASE = 48;
const BOSS_SPEED_PER_LEVEL = 4;
const BOSS_DAMAGE_BASE = 28;
const BOSS_DAMAGE_PER_LEVEL = 5;
const BOSS_SCORE_BASE = 1000;
const BOSS_SCORE_PER_LEVEL = 250;
const BOSS_HISS_INTERVAL_BASE = 5.5;
const BOSS_HISS_RANGE_BASE = 170;
const BOSS_HISS_RANGE_PER_LEVEL = 15;
const BOSS_HISS_DAMAGE_BASE = 18;
const BOSS_HISS_DAMAGE_PER_LEVEL = 4;
const BOSS_HISS_PUSH = 160;
const BOSS_HISS_WINDUP = 0.6;

function bossLevel(waveNum) { return Math.floor(waveNum / 3); } // 1,2,3...
function bossScaled(base, perLvl, lvl) { return base + perLvl * (lvl - 1); }

// ── Boss 名字表 ──
const BOSS_NAMES = ['张振颉', '程泽鑫', '耄耋'];
const BOSS_TITLES = ['炫彩', '哈吉', '暗影', '烈焰', '冰霜', '雷霆', '狂暴', '幽灵', '钢铁', '幻影'];

// ── Boss 图片预加载 ──
let bossImg = null;
let bossHissImg = null;
(function loadBossImg() {
  const img = new Image();
  img.onload = () => { bossImg = img; };
  img.onerror = () => {};
  img.src = 'boss-imgs/boss1.gif';
  if (img.complete && img.naturalWidth > 0) bossImg = img;

  const img2 = new Image();
  img2.onload = () => { bossHissImg = img2; };
  img2.onerror = () => {};
  img2.src = 'boss-imgs/boss_hiss.gif';
  if (img2.complete && img2.naturalWidth > 0) bossHissImg = img2;
})();

// ── Boss 出场警告状态 ──
let bossWarnMsg = '';
let bossWarnTimer = 0;    // 警告显示倒计时
let bossWarnDelay = 0;    // 显示前等待

function getBossName(waveNum) {
  const idx = Math.floor(waveNum / 3) - 1; // 第3波=0, 第6波=1...
  if (idx < BOSS_NAMES.length) return BOSS_NAMES[idx];
  // 第4个起：xx耄耋
  const ti = (idx - BOSS_NAMES.length) % BOSS_TITLES.length;
  return BOSS_TITLES[ti] + '耄耋';
}

function triggerBossWarning(waveNum) {
  bossWarnMsg = '⚠ BOSS ' + getBossName(waveNum) + ' 来了！';
  bossWarnDelay = 0.8;
  bossWarnTimer = 0;
}

function spawnBoss(pool, waveNum, camX, camY, sw, sh) {
  let slot = null;
  for (const e of pool) {
    if (!e.active) { slot = e; break; }
  }
  if (!slot) return null;

  const margin = 100;
  const side = randInt(0, 3);
  const vl = camX - sw / 2 - margin;
  const vr = camX + sw / 2 + margin;
  const vt = camY - sh / 2 - margin;
  const vb = camY + sh / 2 + margin;
  let sx, sy;
  switch (side) {
    case 0: sx = rand(vl, vr); sy = vt; break;
    case 1: sx = vr; sy = rand(vt, vb); break;
    case 2: sx = rand(vl, vr); sy = vb; break;
    case 3: sx = vl; sy = rand(vt, vb); break;
  }

  slot.x = clamp(sx, BOSS_RADIUS, WORLD_SIZE - BOSS_RADIUS);
  slot.y = clamp(sy, BOSS_RADIUS, WORLD_SIZE - BOSS_RADIUS);
  slot.active = true;
  slot.isBoss = true;
  const lv = bossLevel(waveNum);
  slot.bossName = getBossName(waveNum);
  slot.bossLevel = lv;
  slot.radius = BOSS_RADIUS;
  slot.hp = bossScaled(BOSS_BASE_HP, BOSS_HP_PER_LEVEL, lv);
  slot.maxHp = slot.hp;
  slot.speed = bossScaled(BOSS_SPEED_BASE, BOSS_SPEED_PER_LEVEL, lv);
  slot._normalSpeed = slot.speed;
  slot.damage = bossScaled(BOSS_DAMAGE_BASE, BOSS_DAMAGE_PER_LEVEL, lv);
  slot.score = bossScaled(BOSS_SCORE_BASE, BOSS_SCORE_PER_LEVEL, lv);
  // 哈气随等级缩放
  slot.hissInterval = Math.max(3.5, BOSS_HISS_INTERVAL_BASE - (lv - 1) * 0.3);
  slot.hissRange = bossScaled(BOSS_HISS_RANGE_BASE, BOSS_HISS_RANGE_PER_LEVEL, lv);
  slot.hissDamage = bossScaled(BOSS_HISS_DAMAGE_BASE, BOSS_HISS_DAMAGE_PER_LEVEL, lv);
  slot.color = '#E91E63';
  slot.type = 'boss';
  slot.hitFlash = 0;
  slot.rot = 0;
  slot.angle = 0;
  slot.vx = 0;
  slot.vy = 0;
  slot.hissCooldown = 0.8; // 快速首次哈气
  slot.hissWindup = 0;
  slot.hissActive = false;
  slot.hissTimer = 0;
  slot.hissAngle = 0;
  slot.hissHitPlayer = false;
  slot._waves = [];  // wifi 波
  slot.img = bossImg;

  return slot;
}

function updateBosses(pool, dt, player, particles, audio, gameTime) {
  // bossWarnDelay/Timer 由 main.js 统一管理

  for (const e of pool) {
    if (!e.active || !e.isBoss) continue;

    e.hissCooldown -= dt;

    // ── 前摇 ──
    if (e.hissWindup > 0) {
      e.hissWindup -= dt;
      e.speed = e._normalSpeed * 0.3;
      if (e.hissWindup <= 0) {
        e.hissActive = true;
        e.hissTimer = 0.6;
        e.hissHitPlayer = false;
        if (bossHissImg && bossHissImg.complete && bossHissImg.naturalWidth > 0) e.img = bossHissImg;
        e.hissAngle = Math.atan2(player.y - e.y, player.x - e.x);
        audio.playHiss();
        particles.emit(e.x, e.y, {
          count: 10, minSpeed: 30, maxSpeed: 100,
          minLife: 0.1, maxLife: 0.3,
          minSize: 1, maxSize: 4,
          colors: ['#fff', '#ddd', '#FF5722']
        });
      }
      continue;
    }

    // ── 哈气激活 ──
    if (e.hissActive) {
      e.speed = 0;
      e.hissTimer -= dt;

      // 每 0.1s 生成一组 wifi 波
      if (e._waves.length < 6 && (e._waves.length === 0 || e.hissTimer < 0.6 - e._waves.length * 0.1)) {
        e._waves.push({ radius: e.radius + 16, alpha: 1.0 });
      }
      for (const w of e._waves) {
        w.radius += dt * 260;
        w.alpha -= dt * 1.7;
      }
      e._waves = e._waves.filter(w => w.alpha > 0);

      // 伤害 + 击退
      if (player.alive) {
        const dx = player.x - e.x;
        const dy = player.y - e.y;
        const d = Math.sqrt(dx * dx + dy * dy);
        if (d < e.hissRange + player.radius && d > 10) {
          const adiff = Math.abs(normAngle(Math.atan2(dy, dx) - e.hissAngle));
          if (adiff < Math.PI / 3) {
            if (!e.hissHitPlayer && !player.isInvulnerable()) {
              player.takeDamage(e.hissDamage, gameTime);
              e.hissHitPlayer = true;
            }
            const pushX = (dx / d) * BOSS_HISS_PUSH;
            const pushY = (dy / d) * BOSS_HISS_PUSH;
            player.x = clamp(player.x + pushX * dt, player.radius, WORLD_SIZE - player.radius);
            player.y = clamp(player.y + pushY * dt, player.radius, WORLD_SIZE - player.radius);
          }
        }
      }

      // 粒子
      if (Math.random() < 0.4) {
        const a = e.hissAngle + rand(-Math.PI / 3, Math.PI / 3);
        const r = e.radius + Math.random() * e.hissRange;
        particles.emit(e.x + Math.cos(a) * r, e.y + Math.sin(a) * r, {
          count: 1, minSpeed: 5, maxSpeed: 25,
          minLife: 0.1, maxLife: 0.2,
          minSize: 1, maxSize: 3,
          colors: ['#fff', '#eee', '#ddd']
        });
      }

      if (e.hissTimer <= 0) {
        e.hissActive = false;
        e.hissCooldown = e.hissInterval;
        e.img = bossImg; // 换回正常图
        e._waves = [];
      }
      continue;
    }

    e.speed = e._normalSpeed;

    if (e.hissCooldown <= 0 && player.alive) {
      e.hissWindup = BOSS_HISS_WINDUP;
    }
  }
}

// ── 渲染 boss wifi 声波特效 ──
function renderBossEffects(ctx, pool, camX, camY, sw, sh) {
  for (const e of pool) {
    if (!e.active || !e.isBoss) continue;

    const sx = e.x - camX + sw / 2;
    const sy = e.y - camY + sh / 2;
    const maxR = e.hissRange || 180;
    if (sx < -maxR - 50 || sx > sw + maxR + 50 || sy < -maxR - 50 || sy > sh + maxR + 50) continue;

    ctx.save();
    ctx.translate(sx, sy);

    // 前摇脉冲
    if (e.hissWindup > 0) {
      const pulse = Math.sin(e.hissWindup * 15) * 0.4 + 0.6;
      ctx.globalAlpha = pulse;
      ctx.strokeStyle = '#F44336';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(0, 0, e.radius + 10, 0, Math.PI * 2); ctx.stroke();
    }

    // Wifi 式声波：白色扇形弧线
    for (const w of (e._waves || [])) {
      if (w.alpha <= 0) continue;
      const a = w.alpha;
      const arcAngle = Math.PI / 2.5; // 72° 扇形
      const ha = e.hissAngle - arcAngle / 2;
      // 三层弧线（像 wifi 图标）
      const levels = [
        { r: w.radius, lw: 2.5, alphaMul: 1 },
        { r: w.radius + 16, lw: 2, alphaMul: 0.7 },
        { r: w.radius + 30, lw: 1.5, alphaMul: 0.45 },
      ];
      for (const lv of levels) {
        ctx.globalAlpha = a * lv.alphaMul;
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = lv.lw;
        ctx.shadowColor = '#fff';
        ctx.shadowBlur = 6;
        ctx.beginPath();
        ctx.arc(0, 0, lv.r, ha, ha + arcAngle);
        ctx.stroke();
        ctx.shadowBlur = 0;
      }
    }
    ctx.globalAlpha = 1;
    ctx.restore();
  }
}

// ── 渲染 boss 出场警告 ──
function renderBossWarning(ctx, sw, sh, state) {
  // 强制：playing/over/paused 状态绝不显示
  if (state !== 'wavePause') { bossWarnTimer = 0; bossWarnDelay = 0; return; }
  if (bossWarnTimer <= 0) return;
  const s = Math.min(sw, sh) / 600;
  const alpha = bossWarnTimer > 0.8 ? 1 : bossWarnTimer / 0.8;

  ctx.save();
  ctx.globalAlpha = alpha * 0.5;
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, sw, sh);

  const flash = Math.sin(Date.now() / 80) * 0.4 + 0.6;
  ctx.globalAlpha = alpha * flash;
  ctx.strokeStyle = '#F44336';
  ctx.lineWidth = 4;
  ctx.strokeRect(20, 20, sw - 40, sh - 40);

  ctx.globalAlpha = alpha;
  ctx.fillStyle = '#F44336';
  ctx.font = `bold ${Math.round(30 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(bossWarnMsg, sw / 2, sh / 2 - 10);
  ctx.fillStyle = '#aaa';
  ctx.font = `${Math.round(14 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.fillText('准备迎战！', sw / 2, sh / 2 + 30);

  ctx.restore();
}

// ── 渲染 boss 头顶名字（由 main.js 调用，在敌人渲染之后）──
function renderBossNames(ctx, pool, camX, camY, sw, sh) {
  const s = Math.min(sw, sh) / 600;
  ctx.font = `bold ${Math.round(11 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'bottom';
  for (const e of pool) {
    if (!e.active || !e.isBoss) continue;
    const sx = e.x - camX + sw / 2;
    const sy = e.y - camY + sh / 2;
    if (sx < -60 || sx > sw + 60 || sy < -60 || sy > sh + 60) continue;
    ctx.fillStyle = '#FFD700';
    ctx.shadowColor = '#000';
    ctx.shadowBlur = 4;
    const label = e.bossName + ' Lv.' + (e.bossLevel || 1);
    ctx.fillText(label, sx, sy - e.radius - 8);
    ctx.shadowBlur = 0;
  }
}

// BGM 管理器 — 低音量后台播放，支持切换曲目

const BGM_VOLUME = 0.08;

const BGM_PLAYLIST = [
  { name: '不再曼波', file: 'bgm/不再曼波.mp3' },
  { name: '打火基',   file: 'bgm/打火基.mp3' },
];

class BgmManager {
  constructor() {
    this.audios = [];
    this.currentIdx = 0;
    this.playing = false;

    for (const s of BGM_PLAYLIST) {
      const a = new Audio(s.file);
      a.volume = BGM_VOLUME;
      a.loop = false;
      a.preload = 'auto';
      this.audios.push(a);
      a.addEventListener('ended', () => this._randomNext());
    }
  }

  get currentName() {
    return (this.muted ? '[静音] ' : '') + BGM_PLAYLIST[this.currentIdx].name;
  }

  get muted() { return this._muted || false; }

  // 播放进度 0-1
  get progress() {
    const a = this.audios[this.currentIdx];
    if (!a || !a.duration || !isFinite(a.duration)) return 0;
    return a.currentTime / a.duration;
  }

  toggleMute() {
    this._muted = !this._muted;
    for (const a of this.audios) { a.volume = this._muted ? 0 : BGM_VOLUME; }
  }

  play() {
    if (this.playing) return;
    this.playing = true;
    const a = this.audios[this.currentIdx];
    a.currentTime = 0;
    a.play().catch(() => {});
  }

  stop() {
    this.playing = false;
    for (const a of this.audios) {
      a.pause();
      a.currentTime = 0;
    }
  }

  setSong(idx) {
    const wasPlaying = this.playing;
    for (const a of this.audios) { a.pause(); a.currentTime = 0; }
    this.currentIdx = ((idx % this.audios.length) + this.audios.length) % this.audios.length;
    if (wasPlaying) {
      const a = this.audios[this.currentIdx];
      a.play().catch(() => {});
    }
  }

  next() { this.setSong(this.currentIdx + 1); }
  prev() { this.setSong(this.currentIdx - 1); }

  _randomNext() {
    let next;
    const total = this.audios.length;
    if (total <= 1) { next = 0; }
    else {
      do { next = Math.floor(Math.random() * total); }
      while (next === this.currentIdx);
    }
    this.setSong(next);
  }
}

  dpr = window.devicePixelRatio || 1;
  sw = window.innerWidth;
  sh = window.innerHeight;
  canvas.width = sw * dpr;
  canvas.height = sh * dpr;
  canvas.style.width = sw + 'px';

  waveNum++;
  enemies.spawnWave(waveNum, cam.x, cam.y, sw, sh);
  if (waveNum >= 3 && waveNum % 3 === 0) {
    waveMsg = '⚠ BOSS ' + getBossName(waveNum) + ' 第 ' + waveNum + ' 波';
  } else {
    waveMsg = '第 ' + waveNum + ' 波';
  }
  waveMsgTimer = 1.5;
}

// ── 碰 撞：子弹 vs 敌人 ──
function checkBulletHits() {
  const activeBullets = bullets.getActive();
  const activeEnemies = enemies.getActive();
  for (const b of activeBullets) {
    for (let ei = 0; ei < enemies.pool.length; ei++) {
      const e = enemies.pool[ei];
      if (!e.active) continue;
      const d = dist(b.x, b.y, e.x, e.y);
      if (d < e.radius + 4) {
        const pts = enemies.damageAt(ei, b.damage);
        b.active = false;
        // 命中粒子
        particles.emit(b.x, b.y, {
          count: 5,
          minSpeed: 20, maxSpeed: 100,
          minLife: 0.08, maxLife: 0.2,
          minSize: 1, maxSize: 3,
          colors: ['#FFEB3B', '#FF9800', '#fff']
        });
        if (pts > 0) {
          // 击杀
          player.onKill();
          score += pts;
          comboCount++;
          comboTimer = 1.5;
          if (comboCount > bestCombo) bestCombo = comboCount;
          audio.explosion();
          shakeAmt = 6;
          shakeDur = 0.08;
          particles.emit(e.x, e.y, {
            count: 15,
            minSpeed: 40, maxSpeed: 200,
            minLife: 0.15, maxLife: 0.5,
            minSize: 1, maxSize: 5,
            colors: [e.color, '#ff0', '#fff']
          });
          // 连杀加分
          if (comboCount >= 5) score += comboCount * 10;
        } else {
          audio.hit();
          shakeAmt = 2;
          shakeDur = 0.04;
        }
        break;
      }
    }
  }
}

// ── 碰撞：敌人接触玩家 ──
function checkEnemyPlayer() {
  if (!player.alive) return;
  const activeEnemies = enemies.getActive();
  for (const e of activeEnemies) {
    const d = dist(player.x, player.y, e.x, e.y);
    if (d < player.radius + e.radius - 4) {
      if (player.takeDamage(e.damage, gameTime)) {
        audio.playerHit();
        shakeAmt = 12;
        shakeDur = 0.15;
        particles.emit(player.x, player.y, {
          count: 20,
          minSpeed: 30, maxSpeed: 150,
          minLife: 0.2, maxLife: 0.6,
          minSize: 2, maxSize: 6,
          colors: ['#4FC3F7', '#fff', '#f00']
        });
        if (!player.alive) {
          state = STATE.OVER;
          overTimer = 0;
          audio.explosion();
          particles.emit(player.x, player.y, {
            count: 40,
            minSpeed: 60, maxSpeed: 300,
            minLife: 0.3, maxLife: 1.0,
            minSize: 2, maxSize: 8,
            colors: ['#4FC3F7', '#fff', '#f00', '#ff0']
          });
        }
      }
      break;
    }
  }
}

// ── 更新 ──
function update(dt) {
  if (state === STATE.PAUSED) {
    moveJoy.update(dt);
    shootJoy.update(dt);
    if (moveJoy.active || shootJoy.active) {
      state = STATE.PLAYING;
      pauseTimer = 0;
    }
    // 仍然更新粒子（淡出效果）
    particles.update(dt);
    return;
  }

  if (state !== STATE.PLAYING && state !== STATE.WAVE_PAUSE) return;
  gameTime += dt;

  // 连击衰减
  if (comboTimer > 0) {
    comboTimer -= dt;
    if (comboTimer <= 0) comboCount = 0;
  }

  // 波次消息计时
  if (waveMsgTimer > 0) waveMsgTimer -= dt;

  if (state === STATE.PLAYING) {
    // 摇杆
    moveJoy.update(dt);
    shootJoy.update(dt);

    // ── 键盘 WASD 覆盖移动摇杆 ──
    const kx = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
    const ky = (keys['s'] ? 1 : 0) - (keys['w'] ? 1 : 0);
    const kmag = Math.sqrt(kx * kx + ky * ky);
    if (kmag > 0 && !moveJoy.touchId) {
      moveJoy.active = true;
      moveJoy.normX = kx / kmag;
      moveJoy.normY = ky / kmag;
      moveJoy.magnitude = 1;
    } else if (kmag === 0 && !moveJoy.touchId) {
      moveJoy.active = false;
      moveJoy.normX = 0; moveJoy.normY = 0; moveJoy.magnitude = 0;
    }

    // ── 鼠标瞄准覆盖射击摇杆 ──
    if (mouseDown && !shootJoy.touchId && player.alive) {
      const psx = player.x - cam.x + sw / 2;
      const psy = player.y - cam.y + sh / 2;
      const mx = mouseX - psx;
      const my = mouseY - psy;
      const mmag = Math.sqrt(mx * mx + my * my);
      if (mmag > 8) {
        shootJoy.active = true;
        shootJoy.magnitude = 1;
        shootJoy.angle = Math.atan2(my, mx);
      }
    } else if (!mouseDown && !shootJoy.touchId) {
      shootJoy.active = false;
      shootJoy.magnitude = 0;
    }

    // 双手同时离开 → 计时（仅触屏模式）
    if (!isDesktop && !moveJoy.active && !shootJoy.active) {
      pauseTimer += dt;
      if (pauseTimer >= 0.5) {
        state = STATE.PAUSED;
        pauseTimer = 0;
      }
    } else {
      pauseTimer = 0;
    }

    // 玩家
    player.update(dt, moveJoy, shootJoy, WORLD_SIZE);

    // 开火
    if (shootJoy.active && shootJoy.magnitude > 0.15 && player.alive) {
      // 辅助瞄准
      const activeEnemies = enemies.getActive();
      const rawAim = shootJoy.angle;
      const adjusted = aimAssist(player.x, player.y, rawAim, activeEnemies, 50, 0.55);
      player.angle = adjusted;
      player.fire(dt, bullets);

      // 追踪瞄准同一目标
      let curAimedIdx = -1;
      let bestDot = 0.7;
      for (let ei = 0; ei < enemies.pool.length; ei++) {
        const e = enemies.pool[ei];
        if (!e.active) continue;
        const dx2 = e.x - player.x;
        const dy2 = e.y - player.y;
        const d2 = Math.sqrt(dx2 * dx2 + dy2 * dy2);
        if (d2 > 250) continue;
        const dot = (dx2 / d2) * Math.cos(adjusted) + (dy2 / d2) * Math.sin(adjusted);
        if (dot > bestDot) {
          bestDot = dot;
          curAimedIdx = ei;
        }
      }

      if (curAimedIdx >= 0 && curAimedIdx === aimedEnemyIdx) {
        aimedEnemyTimer += dt;
        if (aimedEnemyTimer >= 2.0) {
          player.onAttackStuck();
          aimedEnemyTimer = 0;
        }
      } else {
        aimedEnemyIdx = curAimedIdx;
        aimedEnemyTimer = 0;
      }

      // 每 3 发响一声
      if (Math.abs(player.fireTimer - FIRE_INTERVAL) < 0.001) {
        audio.shoot();
      }
    }

    // 子弹
    bullets.update(dt, WORLD_SIZE);

    // 敌人
    enemies.update(dt, player);

    // Boss 技能更新
    updateBosses(enemies.pool, dt, player, particles, audio, gameTime);

    // 碰撞
    checkBulletHits();
    checkEnemyPlayer();

    // 检查波次清空
    if (enemies.aliveCount === 0) {
      const nextIsBoss = (waveNum + 1) >= 3 && (waveNum + 1) % 3 === 0;
      state = STATE.WAVE_PAUSE;
      wavePauseTimer = nextIsBoss ? 2.0 : 1.4;
      if (nextIsBoss) {
        audio.bossWarning();
        // 直接显示波次消息，不用黑遮罩
        waveMsg = '⚠ BOSS ' + getBossName(waveNum + 1) + ' 来了！';
        waveMsgTimer = 2.0;
      }
      audio.waveClear();
    }
  } else if (state === STATE.WAVE_PAUSE) {
    wavePauseTimer -= dt;
    if (wavePauseTimer <= 0) {
      state = STATE.PLAYING;
      nextWave();
      if (waveNum >= 3 && waveNum % 3 === 0) {
        spawnBoss(enemies.pool, waveNum, cam.x, cam.y, sw, sh);
      }
    }
  }

  // 粒子
  particles.update(dt);

  // 屏幕震动
  if (shakeDur > 0) {
    shakeDur -= dt;
    if (shakeDur <= 0) shakeAmt = 0;
  } else {
    shakeAmt = lerp(shakeAmt, 0, dt * 20);
  }
}

// ── 相机 ──
function updateCamera(dt) {
  if (!player.alive && state === STATE.OVER) return;
  const tx = player.x;
  const ty = player.y;
  cam.x = lerp(cam.x, tx, dt * 5);
  cam.y = lerp(cam.y, ty, dt * 5);
}

// ── 渲染：背景 ──
function drawBg() {
  ctx.fillStyle = '#151515';
  ctx.fillRect(0, 0, sw, sh);

  const grid = 80;
  const sx = Math.floor((cam.x - sw / 2) / grid) * grid;
  const sy = Math.floor((cam.y - sh / 2) / grid) * grid;

  ctx.strokeStyle = '#222';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = sx; x < cam.x + sw / 2; x += grid) {
    const px = x - cam.x + sw / 2;
    ctx.moveTo(px, 0);
    ctx.lineTo(px, sh);
  }
  for (let y = sy; y < cam.y + sh / 2; y += grid) {
    const py = y - cam.y + sh / 2;
    ctx.moveTo(0, py);
    ctx.lineTo(sw, py);
  }
  ctx.stroke();

  // 世界边界
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 2;
  const bx = -cam.x + sw / 2;
  const by = -cam.y + sh / 2;
  ctx.strokeRect(bx, by, WORLD_SIZE, WORLD_SIZE);
}

// ── 渲染：HUD ──
function drawHUD() {
  const s = uiScale();
  ctx.save();
  // 分数 (左上)
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(18 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.textBaseline = 'top';
  ctx.fillText('分数 ' + score, 14, 18 * s);

  // 波次 (右上)
  ctx.textAlign = 'right';
  ctx.fillText('第 ' + waveNum + ' 波', sw - 14, 18 * s);

  // 连击 (中上)
  ctx.textAlign = 'center';
  if (comboCount >= 3) {
    ctx.fillStyle = '#FFEB3B';
    ctx.font = `bold ${Math.round(16 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
    ctx.fillText(comboCount + ' 连杀!', sw / 2, 18 * s);
  }

  // 血量 (左中)
  const barW = Math.round(40 * s), barH = Math.round(6 * s);
  const barX = 14, barY = Math.round(48 * s);
  ctx.fillStyle = '#333';
  ctx.fillRect(barX, barY, barW, barH);
  const hpRatio = player.alive ? player.hp / player.maxHp : 0;
  const hpColor = hpRatio > 0.5 ? '#4CAF50' : hpRatio > 0.25 ? '#FF9800' : '#F44336';
  ctx.fillStyle = hpColor;
  ctx.fillRect(barX, barY, barW * hpRatio, barH);

  // 波次消息 (中央)
  if (waveMsgTimer > 0) {
    const alpha = waveMsgTimer > 0.5 ? 1 : waveMsgTimer / 0.5;
    ctx.globalAlpha = alpha;
    ctx.fillStyle = '#fff';
    ctx.font = `bold ${Math.round(36 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(waveMsg, sw / 2, sh / 2 - 40);
    ctx.globalAlpha = 1;
  }

  // 当前 BGM + 进度条（底部中）
  if (bgm) {
    const bx = sw / 2 - 60 * s;
    const by = sh - 18 * s;
    const bw = 120 * s;
    // 进度条背景
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#333';
    ctx.fillRect(bx, by, bw, 3 * s);
    // 进度条
    ctx.globalAlpha = 0.5;
    ctx.fillStyle = '#aaa';
    ctx.fillRect(bx, by, bw * bgm.progress, 3 * s);
    // 文字
    ctx.globalAlpha = 0.4;
    ctx.fillStyle = '#666';
    ctx.font = `${Math.round(10 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('♪ ' + bgm.currentName + '  ← →切歌', sw / 2, by - 4 * s);
    ctx.globalAlpha = 1;
  }

  ctx.restore();
}

// ── 渲染：开始界面 ──
function drawStartScreen() {
  const s = uiScale();
  ctx.fillStyle = '#151515';
  ctx.fillRect(0, 0, sw, sh);

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(40 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('俯角射击', sw / 2, sh / 2 - 80 * s);

  ctx.fillStyle = '#aaa';
  ctx.font = `${Math.round(16 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.fillText('左手移动  ·  右手射击', sw / 2, sh / 2 - 20 * s);

  // BGM 选歌 — 顶部居中
  {
    const by = 60 * s;
    ctx.fillStyle = 'rgba(255,255,255,0.08)';
    ctx.fillRect(sw / 2 - 140 * s, by - 10 * s, 280 * s, 28 * s);
    ctx.fillStyle = '#ddd';
    ctx.font = `bold ${Math.round(14 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
    ctx.fillText('♪ ' + (bgm ? bgm.currentName : '—'), sw / 2, by);
    // 左右箭头
    ctx.fillStyle = '#aaa';
    ctx.font = `${Math.round(12 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
    ctx.fillText('◀ 点击切歌 ▶', sw / 2, by + 16 * s);
  }

  // iOS 且非独立模式：引导添加到主屏幕
  if (isIOS && !isStandalone) {
    ctx.fillStyle = '#FF9800';
    ctx.font = `${Math.round(14 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
    ctx.fillText('点底部 分享 → 添加到主屏幕', sw / 2, sh / 2 + 20 * s);
    ctx.fillText('可隐藏浏览器栏，获得全屏体验', sw / 2, sh / 2 + 42 * s);
  }

  // 脉冲提示
  const pulse = Math.sin(Date.now() / 800) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(20 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.fillText('点击屏幕开始', sw / 2, sh / 2 + (isIOS && !isStandalone ? 80 : 60) * s);
  ctx.globalAlpha = 1;
}

// ── 渲染：暂停遮罩 ──
function drawPauseOverlay() {
  const s = uiScale();
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillRect(0, 0, sw, sh);

  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(32 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('已暂停', sw / 2, sh / 2 - 10 * s);

  ctx.fillStyle = '#aaa';
  ctx.font = `${Math.round(14 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  const lines = [isDesktop ? 'ESC 继续' : '触摸屏幕继续'];
  if (bgm) {
    lines.push('M 静音/播放 BGM');
    lines.push('← → 切歌  ♪ ' + bgm.currentName);
  }
  lines.forEach((l, i) => ctx.fillText(l, sw / 2, sh / 2 + 25 * s + i * 22 * s));
}

// ── 渲染：结束界面 ──
function drawOverScreen() {
  const s = uiScale();
  // 半透明遮罩
  ctx.fillStyle = 'rgba(0,0,0,0.65)';
  ctx.fillRect(0, 0, sw, sh);

  ctx.fillStyle = '#F44336';
  ctx.font = `bold ${Math.round(36 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('阵亡', sw / 2, sh / 2 - 80 * s);

  ctx.fillStyle = '#fff';
  ctx.font = `${Math.round(18 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  const lines = [
    '分数 ' + score,
    '到达第 ' + waveNum + ' 波',
    '最高连杀 ' + bestCombo
  ];
  lines.forEach((txt, i) => {
    ctx.fillText(txt, sw / 2, sh / 2 - 25 * s + i * 30 * s);
  });

  overTimer += 0.016;
  const pulse = Math.sin(overTimer * 3) * 0.3 + 0.7;
  ctx.globalAlpha = pulse;
  ctx.fillStyle = '#fff';
  ctx.font = `bold ${Math.round(20 * s)}px "PingFang SC","Helvetica Neue",sans-serif`;
  ctx.fillText('点击重新开始', sw / 2, sh / 2 + 60 * s);
  ctx.globalAlpha = 1;
}

// ── 主渲染 ──
function render() {
  ctx.clearRect(0, 0, sw, sh);

  if (state === STATE.START) {
    drawStartScreen();
    return;
  }

  // 震动偏移
  let ox = 0, oy = 0;
  if (shakeAmt > 0.1) {
    ox = (Math.random() - 0.5) * shakeAmt * 2;
    oy = (Math.random() - 0.5) * shakeAmt * 2;
  }
  const rCamX = cam.x + ox;
  const rCamY = cam.y + oy;

  drawBg();

  // 粒子（底层）
  particles.render(ctx, rCamX, rCamY, sw, sh);

  // Boss 特效（底层）
  renderBossEffects(ctx, enemies.pool, rCamX, rCamY, sw, sh);

  // 敌人
  enemies.render(ctx, rCamX, rCamY, sw, sh);

  // Boss 头顶名字
  renderBossNames(ctx, enemies.pool, rCamX, rCamY, sw, sh);

  // 玩家
  player.render(ctx, rCamX, rCamY, sw, sh);

  // 子弹
  bullets.render(ctx, rCamX, rCamY, sw, sh);

  // 摇杆 UI
  moveJoy.render(ctx);
  shootJoy.render(ctx);

  // HUD
  drawHUD();

  // 暂停遮罩
  if (state === STATE.PAUSED) {
    drawPauseOverlay();
  }

  // 结束遮罩
  if (state === STATE.OVER) {
    drawOverScreen();
  }
}

// ── 游戏循环 ──
let lastStamp = 0;
function loop(stamp) {
  requestAnimationFrame(loop);
  const dt = lastStamp ? Math.min((stamp - lastStamp) / 1000, 0.1) : 0.016;
  lastStamp = stamp;

  resize(); // 处理旋转 / 缩放
  updateCamera(dt);
  update(dt);
  render();

  // 开始界面循环动画
  if (state === STATE.START) {
    moveJoy.update(dt);
    shootJoy.update(dt);
  }
}

// ── 触控 ──
function onTouchStart(e) {
  e.preventDefault();
  if (state === STATE.START) {
    startGame();
    return;
  }
  if (state === STATE.OVER) {
    // 点任意位置重来
    startGame();
    return;
  }
  for (const t of e.changedTouches) {
    moveJoy.tryStart(t.identifier, t.clientX, t.clientY, sw);
    shootJoy.tryStart(t.identifier, t.clientX, t.clientY, sw);
  }
  audio.init();
}

function onTouchMove(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    moveJoy.handleMove(t.identifier, t.clientX, t.clientY);
    shootJoy.handleMove(t.identifier, t.clientX, t.clientY);
  }
}

function onTouchEnd(e) {
  e.preventDefault();
  for (const t of e.changedTouches) {
    moveJoy.handleEnd(t.identifier);
    shootJoy.handleEnd(t.identifier);
  }
}

// ── 键盘 + 鼠标（桌面端）──
const keys = {};
let mouseX = 0, mouseY = 0;
let mouseDown = false;
let isDesktop = false; // 桌面模式：禁止自动暂停

window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  isDesktop = true;
  if (['w','a','s','d'].includes(e.key.toLowerCase())) {
    e.preventDefault();
  }
  // ESC 暂停/继续
  if (e.key === 'Escape' && (state === STATE.PLAYING || state === STATE.PAUSED)) {
    e.preventDefault();
    if (state === STATE.PLAYING) { state = STATE.PAUSED; pauseTimer = 0; }
    else { state = STATE.PLAYING; }
  }
  // ← → 切 BGM, M 静音
  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'm') {
    e.preventDefault();
    if (e.key === 'ArrowLeft') bgm.prev();
    else if (e.key === 'ArrowRight') bgm.next();
    else bgm.toggleMute();
  }
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

canvas.addEventListener('mousedown', e => {
  e.preventDefault();
  if (state === STATE.START) {
    // 点击顶部切歌
    if (e.clientY < 100) {
      if (bgm) bgm.next();
      return;
    }
    isDesktop = true;
    startGame();
    return;
  }
  if (state === STATE.OVER) {
    isDesktop = true;
    startGame();
    return;
  }
  audio.init();
  isDesktop = true;
  mouseDown = true;
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mousemove', e => {
  mouseX = e.clientX;
  mouseY = e.clientY;
});

canvas.addEventListener('mouseup', () => { mouseDown = false; });
canvas.addEventListener('mouseleave', () => { mouseDown = false; });

// ── 注册 SW ──
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js');
}

// ── 启动 ──
resize();
setup();
canvas.addEventListener('touchstart', onTouchStart, { passive: false });
canvas.addEventListener('touchmove', onTouchMove, { passive: false });
canvas.addEventListener('touchend', onTouchEnd);
canvas.addEventListener('touchcancel', onTouchEnd);
document.addEventListener('contextmenu', e => e.preventDefault());
requestAnimationFrame(loop);

  </script>
</body>
